<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maré Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=IBM+Plex+Mono:wght@400;500&family=Pirata+One&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Abertura -->
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-inner">
      <div class="intro-eyebrow">Carta náutica de um capitão aprendendo Java</div>
      <h1 class="intro-title" id="introTitle">Maré Negra</h1>
      <div class="intro-bar"><span id="introBar"></span></div>
    </div>
  </div>

  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Rótulos das ilhas projetados do 3D -->
  <div id="labels" class="labels" aria-hidden="true"></div>
  <div id="tip" class="tip" hidden></div>

  <header class="hud-top">
    <div class="brand">
      <h1>Maré Negra</h1>
      <div class="sub">Carta náutica · Java, ilha por ilha</div>
    </div>
    <div class="progress" aria-live="polite">
      <svg viewBox="0 0 64 64" class="ring" aria-hidden="true">
        <circle cx="32" cy="32" r="27" class="ring-bg"/>
        <circle cx="32" cy="32" r="27" class="ring-fg" id="ringFg"/>
      </svg>
      <div><b id="pNum">0 / 30</b><span>dias navegados</span></div>
    </div>
  </header>

  <nav class="hud-bottom" aria-label="Ilhas">
    <button class="isle-btn" data-isle="0" type="button"><small>Visão geral</small>Mar aberto</button>
    <div id="isleBtns" class="isle-btns"></div>
  </nav>

  <aside id="ledger" class="ledger" aria-label="Dias da ilha">
    <div id="ledgerTitle" class="ledger-title"></div>
    <div id="chips" class="chips"></div>
  </aside>

  <div class="hint" id="hint">Arraste para girar · role para aproximar · clique num selo</div>

  <!-- Pergaminho -->
  <div class="scroll-back" id="back" hidden>
    <div class="paper" id="paper">
    <div class="paper-bg" aria-hidden="true"><div class="paper-fill"></div><div class="paper-curl"></div></div>
    <article class="scroll" id="scroll" role="dialog" aria-modal="true" aria-labelledby="sTitle" tabindex="-1">
      <button class="close" id="close" type="button" aria-label="Fechar pergaminho">×</button>
      <div class="eyebrow" id="sEyebrow"></div>
      <h2 id="sTitle"></h2>
      <div class="rule"></div>
      <div id="sBody"></div>
      <div class="nav">
        <button id="prev" type="button">← Dia anterior</button>
        <button id="next" type="button">Próximo dia →</button>
      </div>
    </article>
    </div>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="torn" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".03 .04" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="24" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <noscript><p style="padding:2rem;color:#ecdcb6">Este mapa precisa de JavaScript.</p></noscript>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
